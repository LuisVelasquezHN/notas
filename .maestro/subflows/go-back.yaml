# Volver a la pantalla anterior: botón atrás en Android, gesto desde el borde en iOS.
appId: com.novotechn.notas
---
- hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
